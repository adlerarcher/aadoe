# Deploys the full site (hub + nested apps) to GitHub Pages on push to main.
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install hub
        run: npm ci
      - name: Install nested SPAs
        run: |
          for app in apps/*/; do
            if [ -f "${app}package.json" ]; then
              echo "npm ci --prefix $app"
              npm ci --prefix "$app"
            fi
          done
      - name: Build all (hub + nested)
        run: npm run build
      - name: Verify nested apps in dist
        run: |
          set -e
          # Static apps + every Vite SPA under apps/ must appear in dist/
          for d in sepi gpcp gpic odev; do
            test -d "dist/$d" || { echo "missing dist/$d"; exit 1; }
            echo "ok dist/$d"
          done
          for app in apps/*/; do
            name=$(basename "$app")
            if [ -f "${app}package.json" ]; then
              test -d "dist/$name" || { echo "missing dist/$name"; exit 1; }
              echo "ok dist/$name"
            fi
          done
          # Nested odev pages must ship as real files (Pages 404.html must not be the only hit)
          for f in dist/odev/index.html dist/odev/resources/index.html dist/odev/programs/index.html; do
            test -f "$f" || { echo "missing $f"; exit 1; }
            echo "ok $f"
          done
          ls -la dist dist/odev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
