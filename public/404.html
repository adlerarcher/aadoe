<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Thermal Underground</title>
    <!--
      GitHub Pages serves root 404.html for unknown paths.
      Nested static apps have real files. Nested SPAs (/mdev, /mildev, /guide)
      need their index restored with the requested deep link.
    -->
    <script>
      (function () {
        var path = location.pathname || '/';
        var nested = ['/mdev', '/mildev', '/guide', '/odev'];
        var i;
        for (i = 0; i < nested.length; i++) {
          var base = nested[i];
          if (path === base || path.indexOf(base + '/') === 0) {
            sessionStorage.redirect = location.href;
            location.replace(location.origin + base + '/');
            return;
          }
        }
        sessionStorage.redirect = location.href;
        location.replace(location.origin + '/');
      })();
    </script>
  </head>
  <body></body>
</html>
